run: "uvicorn app.main:app --host 0.0.0.0 --port 8000"
seed: "python scripts_seed.py"
test: "pytest"
base_url: "http://localhost:8000"
endpoints:
  - method: GET
    path: /health
  - method: POST
    path: /images/process-batch
  - method: GET
    path: /posts/{post_id}/images
  - method: POST
    path: /posts/{post_id}/images/{image_id}/check
  - method: POST
    path: /suggestions/{suggestion_id}/approve
  - method: POST
    path: /suggestions/{suggestion_id}/reject
  - method: POST
    path: /eval/run
